<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五子棋 - Gomoku</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Courier New', monospace;
  overflow: hidden;
}
.game-wrapper {
  background: #16213e;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 0 40px rgba(0,100,255,0.12), inset 0 0 20px rgba(0,0,0,0.5);
  border: 2px solid #2a3a5e;
}
canvas {
  display: block;
  margin: 0 auto;
  border-radius: 4px;
  cursor: pointer;
}
.info-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 12px;
  color: #8899bb;
  font-size: 15px;
}
.info-bar .turn { display: flex; align-items: center; gap: 8px; }
.info-bar .stone-preview {
  display: inline-block;
  width: 18px; height: 18px;
  border-radius: 50%;
}
.stone-preview.black { background: #222; box-shadow: 0 0 4px rgba(0,0,0,0.5); }
.stone-preview.white { background: #eee; box-shadow: 0 0 4px rgba(255,255,255,0.3); }
.info-bar .status {
  color: #ffd700;
  font-weight: bold;
  font-size: 16px;
}
.btn {
  background: #2a3a5e;
  color: #ffd700;
  border: none;
  padding: 6px 18px;
  border-radius: 6px;
  font-family: inherit;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.2s;
}
.btn:hover { background: #3a4a7e; }
</style>
</head>
<body>
<div class="game-wrapper">
  <canvas id="boardCanvas"></canvas>
  <div class="info-bar">
    <div class="turn">
      <span>当前:</span>
      <span class="stone-preview black" id="turnIndicator"></span>
      <span id="turnText">黑棋落子</span>
    </div>
    <span class="status" id="statusText"></span>
    <button class="btn" onclick="initGame()">重新开始</button>
  </div>
</div>
<script>
const canvas = document.getElementById('boardCanvas');
const ctx = canvas.getContext('2d');
const turnIndicator = document.getElementById('turnIndicator');
const turnText = document.getElementById('turnText');
const statusText = document.getElementById('statusText');

const BOARD_SIZE = 15;
const CELL = 36;
const PADDING = 28;
const BOARD_PX = CELL * (BOARD_SIZE - 1);
const CANVAS_SIZE = BOARD_PX + PADDING * 2;
canvas.width = canvas.height = CANVAS_SIZE;

const EMPTY = 0, BLACK = 1, WHITE = 2;

let board, currentPlayer, gameOver, moveHistory;

function initGame() {
  board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(EMPTY));
  currentPlayer = BLACK;
  gameOver = false;
  moveHistory = [];
  statusText.textContent = '';
  updateTurnDisplay();
  render();
}

function updateTurnDisplay() {
  turnIndicator.className = 'stone-preview ' + (currentPlayer === BLACK ? 'black' : 'white');
  turnText.textContent = currentPlayer === BLACK ? '黑棋落子' : '白棋落子';
}

function checkWin(row, col, player) {
  const directions = [[1,0],[0,1],[1,1],[1,-1]];
  for (const [dr, dc] of directions) {
    let count = 1;
    for (let dir = -1; dir <= 1; dir += 2) {
      let r = row + dr * dir, c = col + dc * dir;
      while (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === player) {
        count++;
        r += dr * dir;
        c += dc * dir;
      }
    }
    if (count >= 5) return true;
  }
  return false;
}

function isBoardFull() {
  for (let r = 0; r < BOARD_SIZE; r++)
    for (let c = 0; c < BOARD_SIZE; c++)
      if (board[r][c] === EMPTY) return false;
  return true;
}

function handleClick(e) {
  if (gameOver) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;

  // 找到最近的交叉点
  let minDist = Infinity, bestR = -1, bestC = -1;
  for (let r = 0; r < BOARD_SIZE; r++) {
    for (let c = 0; c < BOARD_SIZE; c++) {
      const px = PADDING + c * CELL;
      const py = PADDING + r * CELL;
      const d = Math.hypot(mx - px, my - py);
      if (d < minDist) { minDist = d; bestR = r; bestC = c; }
    }
  }

  // 点击距离必须在半格以内
  if (minDist > CELL * 0.5 || board[bestR][bestC] !== EMPTY) return;

  // 落子
  board[bestR][bestC] = currentPlayer;
  moveHistory.push({ r: bestR, c: bestC, player: currentPlayer });

  if (checkWin(bestR, bestC, currentPlayer)) {
    gameOver = true;
    const name = currentPlayer === BLACK ? '黑棋' : '白棋';
    statusText.textContent = `${name}获胜！`;
    render();
    drawWinLine(bestR, bestC, currentPlayer);
    return;
  }

  if (isBoardFull()) {
    gameOver = true;
    statusText.textContent = '平局！';
    render();
    return;
  }

  currentPlayer = currentPlayer === BLACK ? WHITE : BLACK;
  updateTurnDisplay();
  render();
}

// ============ 绘制获胜连线 ============
function drawWinLine(row, col, player) {
  const directions = [[1,0],[0,1],[1,1],[1,-1]];
  for (const [dr, dc] of directions) {
    let cells = [{r: row, c: col}];
    for (let dir = -1; dir <= 1; dir += 2) {
      let r = row + dr * dir, c = col + dc * dir;
      while (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === player) {
        cells.push({r, c});
        r += dr * dir;
        c += dc * dir;
      }
    }
    if (cells.length >= 5) {
      const first = cells[0], last = cells[cells.length - 1];
      const x1 = PADDING + first.c * CELL;
      const y1 = PADDING + first.r * CELL;
      const x2 = PADDING + last.c * CELL;
      const y2 = PADDING + last.r * CELL;

      ctx.strokeStyle = '#ff4444';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#ff4444';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.shadowBlur = 0;
      break;
    }
  }
}

// ============ 渲染 ============
function render() {
  // 背景
  ctx.fillStyle = '#d4a95a';
  ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

  // 木纹效果
  ctx.strokeStyle = 'rgba(180,140,70,0.3)';
  ctx.lineWidth = 1;
  for (let i = 0; i < CANVAS_SIZE; i += 6) {
    ctx.beginPath();
    ctx.moveTo(0, i + Math.sin(i * 0.05) * 3);
    ctx.lineTo(CANVAS_SIZE, i + Math.sin(i * 0.05 + 1) * 3);
    ctx.stroke();
  }

  // 网格线
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  for (let i = 0; i < BOARD_SIZE; i++) {
    const x = PADDING + i * CELL;
    const y = PADDING + i * CELL;
    ctx.beginPath();
    ctx.moveTo(PADDING, y);
    ctx.lineTo(PADDING + BOARD_PX, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, PADDING);
    ctx.lineTo(x, PADDING + BOARD_PX);
    ctx.stroke();
  }

  // 星位 (天元 + 四角星)
  const starPoints = [[3,3],[3,7],[3,11],[7,3],[7,7],[7,11],[11,3],[11,7],[11,11]];
  ctx.fillStyle = '#333';
  for (const [r, c] of starPoints) {
    ctx.beginPath();
    ctx.arc(PADDING + c * CELL, PADDING + r * CELL, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // 棋子
  for (let r = 0; r < BOARD_SIZE; r++) {
    for (let c = 0; c < BOARD_SIZE; c++) {
      if (board[r][c] === EMPTY) continue;
      const px = PADDING + c * CELL;
      const py = PADDING + r * CELL;
      const radius = CELL * 0.42;

      // 阴影
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath();
      ctx.arc(px + 2, py + 2, radius, 0, Math.PI * 2);
      ctx.fill();

      // 棋子主体
      const grad = ctx.createRadialGradient(px - 4, py - 4, 2, px, py, radius);
      if (board[r][c] === BLACK) {
        grad.addColorStop(0, '#555');
        grad.addColorStop(0.5, '#222');
        grad.addColorStop(1, '#111');
      } else {
        grad.addColorStop(0, '#fff');
        grad.addColorStop(0.5, '#f0f0f0');
        grad.addColorStop(1, '#ccc');
      }
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(px, py, radius, 0, Math.PI * 2);
      ctx.fill();

      // 边框
      ctx.strokeStyle = board[r][c] === BLACK ? '#000' : '#999';
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }
  }

  // 最后一手标记
  if (moveHistory.length > 0) {
    const last = moveHistory[moveHistory.length - 1];
    const px = PADDING + last.c * CELL;
    const py = PADDING + last.r * CELL;
    ctx.fillStyle = last.player === BLACK ? '#ff6666' : '#ff4444';
    ctx.beginPath();
    ctx.arc(px, py, 4, 0, Math.PI * 2);
    ctx.fill();
  }
}

canvas.addEventListener('click', handleClick);

// ============ 键盘快捷键 ============
document.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') { initGame(); }
  // Ctrl+Z 悔棋
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !gameOver && moveHistory.length > 0) {
    const last = moveHistory.pop();
    board[last.r][last.c] = EMPTY;
    currentPlayer = last.player;
    updateTurnDisplay();
    render();
    e.preventDefault();
  }
});

initGame();
</script>
</body>
</html>
