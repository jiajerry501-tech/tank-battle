<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>经典游戏合集</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Courier New', monospace;
  overflow-x: hidden;
  overflow-y: auto;
}
.container {
  text-align: center;
  padding: 20px;
}
@media (max-width: 500px) {
  .card { width: calc(50% - 12px); min-width: 130px; padding: 20px 16px 18px; }
  .card-icon { font-size: 32px; }
  .card-title { font-size: 14px; }
  .card-desc { font-size: 11px; }
  h1 { font-size: 26px; letter-spacing: 4px; }
}
h1 {
  color: #4aec7e;
  font-size: 36px;
  letter-spacing: 6px;
  margin-bottom: 10px;
  text-shadow: 0 0 20px rgba(74,236,126,0.3);
}
.subtitle {
  color: #8899bb;
  font-size: 14px;
  margin-bottom: 40px;
  letter-spacing: 2px;
}
.games {
  display: flex;
  gap: 24px;
  justify-content: center;
  flex-wrap: wrap;
}
.card {
  background: #16213e;
  border: 2px solid #2a3a5e;
  border-radius: 12px;
  padding: 30px 24px 24px;
  width: 200px;
  cursor: pointer;
  transition: all 0.3s ease;
  text-decoration: none;
  display: block;
}
.card:hover {
  border-color: #4aec7e;
  transform: translateY(-6px);
  box-shadow: 0 12px 30px rgba(74,236,126,0.15);
}
.card-icon {
  font-size: 48px;
  margin-bottom: 12px;
}
.card-title {
  color: #e0e8f0;
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 6px;
}
.card-desc {
  color: #8899bb;
  font-size: 12px;
  line-height: 1.6;
}
.card:hover .card-title { color: #4aec7e; }
.footer {
  margin-top: 40px;
  color: #445566;
  font-size: 11px;
  letter-spacing: 1px;
}
</style>
</head>
<body>
<div class="container">
  <h1>经典游戏</h1>
  <div class="subtitle">SELECT A GAME</div>
  <div class="games">
    <a href="tank.html" class="card">
      <div class="card-icon">🎮</div>
      <div class="card-title">坦克大战</div>
      <div class="card-desc">经典 Battle City 复刻<br>保护基地，消灭20辆敌军坦克<br>方向键移动 / 空格开火</div>
    </a>
    <a href="chinese-chess.html" class="card">
      <div class="card-icon">🐴</div>
      <div class="card-title">中国象棋</div>
      <div class="card-desc">传统中国象棋，支持双人/人机<br>9×10 棋盘，完整规则<br>点击选子走棋，Ctrl+Z 悔棋</div>
    </a>
    <a href="gomoku.html" class="card">
      <div class="card-icon">⚫</div>
      <div class="card-title">五子棋</div>
      <div class="card-desc">15×15 棋盘，支持双人/AI<br>黑棋先行，先连五子获胜<br>点击交叉点落子</div>
    </a>
    <a href="minesweeper.html" class="card">
      <div class="card-icon">💣</div>
      <div class="card-title">扫雷</div>
      <div class="card-desc">经典扫雷，三种难度可选<br>左键挖开，右键标旗<br>首次点击保证安全</div>
    </a>
  </div>
  <div class="footer">纯前端 HTML 游戏合集 · 无需服务器 · 打开即玩</div>
</div>
</body>
</html>
